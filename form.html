<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Brian Ito de Oliveira Moura">
    <meta name="description" content="WDD131 Product Review Form with good form design practices, meeting specific field requirements. Week 5">
    <link rel="stylesheet" href="styles/form.css">
    <title>Product Review Form</title>
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Product Review</h1>
    </header>
    <main>
      <form action="review.html" method="get">
        <label for="product-name">
          Product Name
        </label>
        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Select a product...</option>
        </select>
        <p>Overall Rating</p>
        <div class="stars">
          <input type="radio" id="rating-1" name="overall-rating" value="1" required>
          <label for="rating-1" title="1 star"></label>
          <input type="radio" id="rating-2" name="overall-rating" value="2" required>
          <label for="rating-2" title="2 stars"></label>
          <input type="radio" id="rating-3" name="overall-rating" value="3" required>
          <label for="rating-3" title="3 stars"></label>
          <input type="radio" id="rating-4" name="overall-rating" value="4" required>
          <label for="rating-4" title="4 stars"></label>
          <input type="radio" id="rating-5" name="overall-rating" value="5" required>
          <label for="rating-5" title="5 stars"></label>
        </div>
        <p>
          <label for="installation-date">
            Date of Installation
          </label>
        </p>
        <input type="date" id="installation-date" name="installation-date" required>
        <p>Which features do you find useful in the product (Check all that apply)</p>
        <p>
          <label for="durability">
            <input type="checkbox" id="durability" name="durability" value="durability"> Durability
          </label>
        </p>
        <p>
          <label for="ease">
            <input type="checkbox" id="ease" name="ease" value="ease"> Ease of use
          </label>
        </p>
        <p>
          <label for="perf">
            <input type="checkbox" id="perf" name="perf" value="perf"> Performance
          </label>
        </p>
        <p>
          <label for="design">
            <input type="checkbox" id="design" name="design" value="design"> Durability
          </label>
        </p>
        <p>Written Review <span>(optional)</span></p>
        <label for="written-review">
          <textarea name="written-review" id="written-review"></textarea>
        </label>
        <p>
          <label for="name">
            Your name <span>(optional)</span>
          </label>
        </p>
        <input id="name" type="text">
        <p>
          <input type="submit" value="Post Review">
        </p>
      </form>
    </main>
    <footer>
      <p>
        Brian Ito de Oliveira Moura - Amazonas &copy;
        <span id="currentyear"></span>
      </p>
      <p id="lastmodified"></p>
    </footer>
  </body>
</html>
